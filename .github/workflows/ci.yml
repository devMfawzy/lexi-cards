name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated localizations are committed, so a mismatch between the ARB
      # files and the generated Dart would otherwise only surface at runtime.
      - name: Check generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n || {
            echo "::error::lib/l10n is stale — run 'flutter gen-l10n' and commit the result."
            exit 1
          }

      # Generated files are excluded: their formatting belongs to whatever
      # generated them, and dart format would fight the generator forever.
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files '*.dart' | grep -vE '^lib/l10n/|\.g\.dart$')

      - run: flutter analyze --fatal-infos

      - run: flutter test

  # Neither analyze nor the tests compile for a platform, so a Gradle or
  # manifest problem passes both and still fails on a device. This job exists
  # because exactly that happened: a plugin needed core library desugaring,
  # and the app could not build for Android at all.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the working tree, not history. A key that was committed once can
      # never be removed from history, so scanning history would fail forever
      # and teach everyone to ignore the job. This fails only when a new secret
      # is about to land.
      #
      # This job must not build anything. gitleaks scans every file on disk,
      # including gitignored build output and vendored dependencies, which
      # carry example keys of their own. A bare checkout is exactly the
      # tracked tree, which is what we want scanned.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner
